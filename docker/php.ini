expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
memory_limit=256M
upload_max_filesize=20M
post_max_size=21M
; Slow mobile connections need time to send a 10 MB photo.
max_input_time=300
; Upload progress tracking is not used; turned off as hardening.
session.upload_progress.enabled=0
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
